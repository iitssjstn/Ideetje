services:
  date-vraag:
    image: ghcr.io/iitssjstn/ideetje:latest
    container_name: date-vraag
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      # Hier bewaart het adminpaneel (/admin) de webhook en het wachtwoord
      - date-vraag-data:/app/data
      # Optioneel: eigen gifjes vanaf de server gebruiken (zie GIFS in public/index.html)
      # - ./gifs:/app/public/gifs:ro

volumes:
  date-vraag-data:
